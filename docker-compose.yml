services:
  callpilot-dashboard:
    build:
      context: .
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    env_file: .env   # runtime server variables, including API_BASE_URL
    container_name: callpilot-dashboard
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
